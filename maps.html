<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USGS Map Explorer</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      height: 48px;
      background: var(--bz-bg-plus-2);
      border-bottom: 1px solid var(--bz-border-light);
      flex-shrink: 0;
    }

    .header-title {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--bz-fg-primary);
      white-space: nowrap;
    }

    .header-sep {
      width: 1px;
      height: 14px;
      background: var(--bz-border-light);
    }

    .header-layer {
      font-size: var(--font-size-xs);
      color: var(--bz-fg-tertiary);
    }

    .header-coords {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: var(--font-size-xs);
      color: var(--bz-fg-tertiary);
    }

    /* Layout */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: var(--bz-bg-plus-1);
      border-right: 1px solid var(--bz-border-light);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar-section {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--bz-border-light);
    }

    .section-label {
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: var(--tracking-eyebrow);
      color: var(--bz-fg-tertiary);
      margin-bottom: 8px;
    }

    /* Search */
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bz-bg-plus-2);
      border: 1px solid var(--bz-border-light);
      border-radius: var(--radius-md);
      padding: 6px 10px;
    }

    .search-box:focus-within {
      border-color: var(--bz-border-strong);
    }

    .search-box svg { color: var(--bz-fg-tertiary); flex-shrink: 0; }

    .search-box input {
      background: none;
      border: none;
      outline: none;
      color: var(--bz-fg-primary);
      font-family: var(--bz-font-body);
      font-size: var(--font-size-sm);
      width: 100%;
    }

    .search-box input::placeholder { color: var(--bz-fg-tertiary); }

    /* Autocomplete dropdown */
    .search-wrap { position: relative; }

    .autocomplete-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--bz-bg-plus-2);
      border: 1px solid var(--bz-border-medium);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      z-index: 2000;
      overflow: hidden;
      display: none;
    }

    .autocomplete-list.open { display: block; }

    .autocomplete-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 10px;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: var(--bz-font-body);
      transition: background 100ms;
    }

    .autocomplete-item:hover,
    .autocomplete-item.focused {
      background: var(--bz-bg-plus-1);
    }

    .autocomplete-item svg { color: var(--bz-fg-tertiary); flex-shrink: 0; margin-top: 2px; }

    .autocomplete-primary {
      font-size: var(--font-size-sm);
      color: var(--bz-fg-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .autocomplete-secondary {
      font-size: var(--font-size-xs);
      color: var(--bz-fg-tertiary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .autocomplete-spinner {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      color: var(--bz-fg-tertiary);
      font-size: var(--font-size-xs);
    }

    /* Layer buttons */
    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--bz-border-light) transparent;
    }

    .layer-list { display: flex; flex-direction: column; gap: 1px; }

    .layer-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      background: none;
      cursor: pointer;
      text-align: left;
      width: 100%;
      font-family: var(--bz-font-body);
      transition: background 120ms, border-color 120ms;
    }

    .layer-btn:hover { background: var(--bz-bg-base); }

    .layer-btn.active {
      background: var(--bz-bg-plus-2);
      border-color: var(--bz-border-medium);
    }

    .layer-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .layer-name {
      font-size: var(--font-size-sm);
      color: var(--bz-fg-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .layer-desc {
      font-size: var(--font-size-xs);
      color: var(--bz-fg-tertiary);
    }

    /* Overlay items */
    .overlay-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 8px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      font-family: var(--bz-font-body);
      width: 100%;
      background: none;
      transition: background 120ms;
    }

    .overlay-item:hover { background: var(--bz-bg-base); }

    .overlay-item.active {
      background: var(--bz-bg-plus-2);
      border-color: var(--bz-border-medium);
    }

    .overlay-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--font-size-sm);
      color: var(--bz-fg-primary);
    }

    .toggle {
      width: 30px;
      height: 17px;
      border-radius: 99px;
      background: var(--bz-border-medium);
      position: relative;
      flex-shrink: 0;
      transition: background 200ms;
    }

    .toggle::after {
      content: '';
      position: absolute;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: white;
      top: 2px;
      left: 2px;
      transition: transform 200ms;
    }

    .overlay-item.active .toggle { background: var(--bz-fg-primary); }
    .overlay-item.active .toggle::after { transform: translateX(13px); }

    .opacity-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 8px 8px;
    }

    .opacity-label {
      font-size: var(--font-size-xs);
      color: var(--bz-fg-tertiary);
      width: 44px;
      flex-shrink: 0;
    }

    .opacity-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 2px;
      border-radius: 99px;
      background: var(--bz-border-medium);
      outline: none;
    }

    .opacity-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--bz-fg-secondary);
      cursor: pointer;
    }

    .opacity-value {
      font-family: var(--font-mono);
      font-size: var(--font-size-xs);
      color: var(--bz-fg-tertiary);
      width: 28px;
      text-align: right;
    }

    /* Map containers */
    #map { flex: 1; }
    #map-3d { flex: 1; display: none; }

    /* Mapbox GL UI */
    .mapboxgl-ctrl-attrib {
      font-family: var(--bz-font-body) !important;
      font-size: 10px !important;
      background: rgba(250,246,245,0.85) !important;
    }
    .mapboxgl-ctrl-group {
      box-shadow: var(--shadow-sm) !important;
      border-radius: var(--radius-md) !important;
      overflow: hidden;
    }
    .mapboxgl-ctrl-group button {
      background: var(--bz-bg-plus-2) !important;
    }
    .mapboxgl-ctrl-group button:hover { background: var(--bz-bg-plus-1) !important; }

    /* 3D hint badge */
    #hint-3d {
      display: none;
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(250,246,245,0.92);
      border: 1px solid var(--bz-border-light);
      border-radius: var(--radius-md);
      padding: 6px 10px;
      font-size: var(--font-size-xs);
      color: var(--bz-fg-tertiary);
      pointer-events: none;
      z-index: 10;
      box-shadow: var(--shadow-xs);
    }

    .leaflet-control-attribution {
      font-family: var(--bz-font-body) !important;
      font-size: 10px !important;
      background: rgba(250,246,245,0.85) !important;
      color: var(--bz-fg-tertiary) !important;
    }

    .leaflet-control-attribution a { color: var(--bz-fg-secondary) !important; }

    .leaflet-control-zoom { border: none !important; box-shadow: var(--shadow-sm) !important; }

    .leaflet-control-zoom a {
      background: var(--bz-bg-plus-2) !important;
      color: var(--bz-fg-primary) !important;
      border-color: var(--bz-border-light) !important;
      font-family: var(--bz-font-body) !important;
    }

    .leaflet-control-zoom a:hover { background: var(--bz-bg-plus-1) !important; }

    .leaflet-popup-content-wrapper {
      background: var(--bz-bg-plus-2) !important;
      color: var(--bz-fg-primary) !important;
      border-radius: var(--radius-md) !important;
      box-shadow: var(--shadow-md) !important;
      font-family: var(--bz-font-body) !important;
      font-size: var(--font-size-sm) !important;
    }

    .leaflet-popup-tip { background: var(--bz-bg-plus-2) !important; }
  </style>
</head>
<body>

<header>
  <span class="header-title">USGS Map Explorer</span>
  <div class="header-sep"></div>
  <span class="header-layer" id="active-layer">US Topo</span>
  <span class="header-coords" id="coords"></span>
</header>

<div class="workspace">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="section-label">Search</div>
      <div class="search-wrap">
        <div class="search-box">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="search-input" placeholder="City, state, or lat,lng…" autocomplete="off" />
        </div>
        <div class="autocomplete-list" id="autocomplete-list"></div>
      </div>
    </div>

    <div class="sidebar-scroll">
      <div class="sidebar-section">
        <div class="section-label">Base Layer</div>
        <div class="layer-list" id="base-layers"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-label">Overlays</div>
        <div class="layer-list" id="overlay-layers"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-label">3D</div>
        <div class="layer-list">
          <button class="layer-btn" id="btn-3d" onclick="toggle3D()">
            <span class="layer-dot" style="background:#897069"></span>
            <span>
              <div class="layer-name">3D Buildings</div>
              <div class="layer-desc">Extrusions at street level</div>
            </span>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <div id="map"></div>
  <div id="map-3d"></div>
  <div id="hint-3d">Loading…</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<script>
  const BASE_LAYERS = [
    { id: 'topo',          name: 'US Topo',          desc: 'Contours & terrain',   color: '#55716a', url: 'https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}',            attr: 'USGS The National Map', maxZoom: 21, maxNativeZoom: 16 },
    { id: 'imagery',       name: 'Satellite Imagery', desc: 'Aerial photography',   color: '#4e5c72', url: 'https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}',     attr: 'USGS The National Map', maxZoom: 21, maxNativeZoom: 16 },
    { id: 'imagery-topo',  name: 'Imagery + Topo',   desc: 'Satellite with labels', color: '#7663a5', url: 'https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryTopo/MapServer/tile/{z}/{y}/{x}',     attr: 'USGS The National Map', maxZoom: 21, maxNativeZoom: 16 },
    { id: 'shaded-relief', name: 'Shaded Relief',    desc: 'Hillshade elevation',   color: '#897069', url: 'https://basemap.nationalmap.gov/arcgis/rest/services/USGSShadedReliefOnly/MapServer/tile/{z}/{y}/{x}', attr: 'USGS The National Map', maxZoom: 21, maxNativeZoom: 16 },
    { id: 'hydro',         name: 'Hydro Cached',     desc: 'Waterways & basins',    color: '#5d6b81', url: 'https://basemap.nationalmap.gov/arcgis/rest/services/USGSHydroCached/MapServer/tile/{z}/{y}/{x}',     attr: 'USGS The National Map', maxZoom: 21, maxNativeZoom: 16 },
    { id: 'osm',           name: 'OpenStreetMap',    desc: 'Community street map',  color: '#897069', url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',                                                      attr: '© OpenStreetMap contributors', maxZoom: 21, maxNativeZoom: 19 },
  ];

  const OVERLAY_LAYERS = [
    { id: 'transportation', name: 'Transportation',    color: '#c19271', url: 'https://carto.nationalmap.gov/arcgis/rest/services/transportation/MapServer/tile/{z}/{y}/{x}', maxZoom: 16 },
    { id: 'contours',       name: 'Contour Lines',    color: '#897069', url: 'https://carto.nationalmap.gov/arcgis/rest/services/contours/MapServer/tile/{z}/{y}/{x}',       maxZoom: 16 },
    { id: 'boundaries',     name: 'Boundaries',       color: '#ad717e', url: 'https://carto.nationalmap.gov/arcgis/rest/services/govunits/MapServer/tile/{z}/{y}/{x}',       maxZoom: 16 },
    { id: 'geonames',       name: 'Geographic Names', color: '#927ec5', url: 'https://carto.nationalmap.gov/arcgis/rest/services/geonames/MapServer/tile/{z}/{y}/{x}',       maxZoom: 16 },
  ];

  const map = L.map('map', { center: [34.1335, -118.3172], zoom: 13 });

  let currentBase = null;
  const overlayState = {};

  function setBase(def) {
    if (currentBase) map.removeLayer(currentBase);
    currentBase = L.tileLayer(def.url, { attribution: def.attr, maxZoom: def.maxZoom, maxNativeZoom: def.maxNativeZoom }).addTo(map);
    map.setMaxZoom(def.maxZoom);
    document.getElementById('active-layer').textContent = def.name;
    document.querySelectorAll('[data-base]').forEach(b => b.classList.toggle('active', b.dataset.base === def.id));
  }

  BASE_LAYERS.forEach(def => {
    const btn = document.createElement('button');
    btn.className = 'layer-btn';
    btn.dataset.base = def.id;
    btn.innerHTML = `
      <span class="layer-dot" style="background:${def.color}"></span>
      <span>
        <div class="layer-name">${def.name}</div>
        <div class="layer-desc">${def.desc}</div>
      </span>`;
    btn.addEventListener('click', () => setBase(def));
    document.getElementById('base-layers').appendChild(btn);
  });

  OVERLAY_LAYERS.forEach(def => {
    const layer = L.tileLayer(def.url, { attribution: 'USGS The National Map', maxZoom: def.maxZoom, opacity: 0.8 });
    overlayState[def.id] = { layer, active: false, opacity: 0.8 };

    const item = document.createElement('button');
    item.className = 'overlay-item';
    item.innerHTML = `
      <span class="overlay-label">
        <span class="layer-dot" style="background:${def.color}"></span>
        ${def.name}
      </span>
      <div class="toggle"></div>`;

    const opRow = document.createElement('div');
    opRow.className = 'opacity-row';
    opRow.style.display = 'none';
    opRow.innerHTML = `
      <span class="opacity-label">Opacity</span>
      <input type="range" class="opacity-slider" min="0" max="100" value="80">
      <span class="opacity-value">80%</span>`;

    opRow.querySelector('.opacity-slider').addEventListener('input', e => {
      const v = parseInt(e.target.value);
      opRow.querySelector('.opacity-value').textContent = v + '%';
      overlayState[def.id].opacity = v / 100;
      if (overlayState[def.id].active) overlayState[def.id].layer.setOpacity(v / 100);
    });

    item.addEventListener('click', () => {
      const s = overlayState[def.id];
      s.active = !s.active;
      s.active ? s.layer.addTo(map) : map.removeLayer(s.layer);
      item.classList.toggle('active', s.active);
      opRow.style.display = s.active ? 'flex' : 'none';
    });

    document.getElementById('overlay-layers').appendChild(item);
    document.getElementById('overlay-layers').appendChild(opRow);
  });

  setBase(BASE_LAYERS[0]);

  const coordsEl = document.getElementById('coords');
  map.on('mousemove', e => {
    coordsEl.textContent = `${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;
  });

  const searchInput = document.getElementById('search-input');
  const autocompleteList = document.getElementById('autocomplete-list');
  let searchMarker = null;
  let debounceTimer = null;
  let focusedIndex = -1;
  let currentResults = [];

  function closeDropdown() {
    autocompleteList.classList.remove('open');
    autocompleteList.innerHTML = '';
    focusedIndex = -1;
    currentResults = [];
  }

  function renderResults(results) {
    currentResults = results;
    focusedIndex = -1;
    autocompleteList.innerHTML = '';

    if (!results.length) {
      autocompleteList.innerHTML = '<div class="autocomplete-spinner">No results found</div>';
      autocompleteList.classList.add('open');
      return;
    }

    results.forEach((r, i) => {
      const parts = r.display_name.split(', ');
      const primary = parts.slice(0, 2).join(', ');
      const secondary = parts.slice(2).join(', ');

      const btn = document.createElement('button');
      btn.className = 'autocomplete-item';
      btn.dataset.index = i;
      btn.innerHTML = `
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
        </svg>
        <div style="min-width:0">
          <div class="autocomplete-primary">${primary}</div>
          ${secondary ? `<div class="autocomplete-secondary">${secondary}</div>` : ''}
        </div>`;

      btn.addEventListener('mousedown', e => {
        e.preventDefault();
        selectResult(r);
      });

      autocompleteList.appendChild(btn);
    });

    autocompleteList.classList.add('open');
  }

  function setFocused(index) {
    const items = autocompleteList.querySelectorAll('.autocomplete-item');
    items.forEach(el => el.classList.remove('focused'));
    focusedIndex = Math.max(-1, Math.min(index, items.length - 1));
    if (focusedIndex >= 0) items[focusedIndex].classList.add('focused');
  }

  function selectResult(r) {
    const parts = r.display_name.split(', ');
    searchInput.value = parts.slice(0, 2).join(', ');
    closeDropdown();
    flyTo(+r.lat, +r.lon, r.display_name);
  }

  async function fetchSuggestions(q) {
    autocompleteList.innerHTML = '<div class="autocomplete-spinner">Searching…</div>';
    autocompleteList.classList.add('open');
    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=6&countrycodes=us&addressdetails=0`,
        { headers: { 'Accept-Language': 'en' } }
      );
      const data = await res.json();
      renderResults(data);
    } catch {
      closeDropdown();
    }
  }

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    clearTimeout(debounceTimer);
    if (q.length < 2) { closeDropdown(); return; }
    const coords = q.match(/^-?\d+\.?\d*\s*,\s*-?\d+\.?\d*$/);
    if (coords) { closeDropdown(); return; }
    debounceTimer = setTimeout(() => fetchSuggestions(q), 300);
  });

  searchInput.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setFocused(focusedIndex + 1); return; }
    if (e.key === 'ArrowUp')   { e.preventDefault(); setFocused(focusedIndex - 1); return; }
    if (e.key === 'Escape')    { closeDropdown(); return; }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (focusedIndex >= 0 && currentResults[focusedIndex]) {
        selectResult(currentResults[focusedIndex]);
      } else {
        const q = searchInput.value.trim();
        const coords = q.match(/^(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)$/);
        if (coords) { closeDropdown(); flyTo(+coords[1], +coords[2], q); }
        else if (currentResults[0]) selectResult(currentResults[0]);
      }
    }
  });

  searchInput.addEventListener('blur', () => setTimeout(closeDropdown, 150));

  function flyTo(lat, lng, label) {
    if (searchMarker) map.removeLayer(searchMarker);
    if (is3D) {
      ml3d.flyTo({ center: [lng, lat], zoom: 15, pitch: 60, duration: 1400 });
    } else {
      searchMarker = L.marker([lat, lng]).addTo(map).bindPopup(label).openPopup();
      map.flyTo([lat, lng], 12, { duration: 1.2 });
    }
  }

  // ── 3D BUILDINGS (Mapbox GL JS) ───────────────────────────────────────────
  mapboxgl.accessToken = 'pk.eyJ1IjoiYnp5bHVrZSIsImEiOiJjbWMxMWd3OGYwOXhmMmxyMmRnMWR5MnlyIn0.bcV6lxlhHmy0x5THKeFeDw';

  let ml3d = null;
  let is3D = false;

  function toggle3D() {
    is3D ? exit3D() : enter3D();
  }

  function enter3D() {
    is3D = true;
    document.getElementById('btn-3d').classList.add('active');
    document.getElementById('map').style.display = 'none';
    document.getElementById('map-3d').style.display = 'flex';
    document.getElementById('hint-3d').style.display = 'block';
    document.getElementById('active-layer').textContent = '3D Buildings';

    const c = map.getCenter();
    const zoom = Math.max(map.getZoom(), 15);

    if (!ml3d) {
      // Let the browser reflow so the container has real dimensions
      requestAnimationFrame(() => {
      ml3d = new mapboxgl.Map({
        container: 'map-3d',
        style: 'mapbox://styles/bzyluke/cmpjr4m8m003d01s4gqr12kjf',
        center: [c.lng, c.lat],
        zoom,
        pitch: 50,
        maxPitch: 85,
        antialias: true,
      });

      ml3d.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), 'top-right');

      ml3d.on('load', () => {
        document.getElementById('hint-3d').textContent = 'Right-drag to orbit · scroll to zoom to street level';
      });

      ml3d.on('mousemove', e => {
        document.getElementById('coords').textContent =
          `${e.lngLat.lat.toFixed(4)}, ${e.lngLat.lng.toFixed(4)}`;
      });

      ml3d.on('moveend', () => {
        const center = ml3d.getCenter();
        document.getElementById('coords').textContent =
          `${center.lat.toFixed(4)}, ${center.lng.toFixed(4)}`;
      });
      }); // end requestAnimationFrame
    } else {
      ml3d.resize();
      ml3d.jumpTo({ center: [c.lng, c.lat], zoom, pitch: 50 });
    }
  }

  function exit3D() {
    is3D = false;
    document.getElementById('btn-3d').classList.remove('active');
    document.getElementById('map-3d').style.display = 'none';
    document.getElementById('hint-3d').style.display = 'none';
    document.getElementById('map').style.display = 'block';

    if (ml3d) {
      const c = ml3d.getCenter();
      map.setView([c.lat, c.lng], Math.round(ml3d.getZoom()));
    }

    const activeBtn = document.querySelector('[data-base].active');
    if (activeBtn) {
      const def = BASE_LAYERS.find(l => l.id === activeBtn.dataset.base);
      if (def) document.getElementById('active-layer').textContent = def.name;
    }
  }
</script>
</body>
</html>
